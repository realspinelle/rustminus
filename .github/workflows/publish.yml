name: Publish to npm

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write # required for OIDC Trusted Publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish/view)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Check if this version needs publishing
        id: version_check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"
          if npm view "rustminus@$LOCAL_VERSION" version >/dev/null 2>&1; then
            echo "Version $LOCAL_VERSION is already published on npm. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $LOCAL_VERSION is not yet on npm. Will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing / OIDC, no token needed)
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish
